# 개발용 MQTT 브로커 설정
#
# 로컬 실행:
#     mosquitto -c broker/mosquitto.conf -v
#
# 인증 없이 열어두는 건 개발 편의를 위한 것이다. 로컬 루프백에만 바인딩하므로
# 외부에서는 접근할 수 없다. 배포 시에는 인증을 붙여야 한다.

listener 1883 127.0.0.1
allow_anonymous true

# 로봇 20대 x 5Hz 상태 보고를 감당할 수 있게
max_queued_messages 10000
max_inflight_messages 100

persistence false
log_type error
log_type warning
log_type notice
